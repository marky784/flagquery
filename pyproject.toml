[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flagquery"
version = "0.1.0"
description = "Answer whether a feature flag is on, and why, from a plain-text flags file."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "marky784"}]
dependencies = []

[project.scripts]
flagquery = "flagquery.cli:main"

[tool.setuptools.packages.find]
include = ["flagquery*"]
